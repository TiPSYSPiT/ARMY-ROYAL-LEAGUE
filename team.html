<link rel="stylesheet" href="css/style.css">
<script>
/* Applies the saved theme before first paint so there is no flash of the
   wrong colour scheme. Kept inline and dependency-free on purpose. */
(function () {
  var stored = null;
  try { stored = localStorage.getItem('arl_theme'); } catch (e) {}
  if (stored !== 'light' && stored !== 'dark') stored = null;

  var root = document.documentElement;
  if (stored) root.setAttribute('data-theme', stored);

  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-effective', stored || (prefersDark ? 'dark' : 'light'));
})();
</script>
</head>
